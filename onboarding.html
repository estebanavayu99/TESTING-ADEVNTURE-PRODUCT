<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuéntanos de ti — Pickmap</title>
<meta name="description" content="Cuéntanos tu edad, con quién viajas y qué te gusta para que Pickmap arme panoramas 100% para ti.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23F6CD4C%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="mode-client auth-body">

<div class="skyline" aria-hidden="true">
  <div class="sky"></div>
  <div class="sky-night"></div>
  <div class="stars"></div>
  <div class="sun"></div>
  <div class="cloud cloud--1"></div>
  <div class="cloud cloud--2"></div>
  <div class="cloud cloud--3"></div>
  <div class="cloud cloud--storm cloud--storm-1"></div>
  <div class="cloud cloud--storm cloud--storm-2"></div>
  <svg class="bird bird--1" viewBox="0 0 40 20"><path d="M0 10 Q10 0 20 10 Q30 0 40 10" /></svg>
  <svg class="bird bird--2" viewBox="0 0 40 20"><path d="M0 10 Q10 0 20 10 Q30 0 40 10" /></svg>
  <svg class="bird bird--3" viewBox="0 0 40 20"><path d="M0 10 Q10 0 20 10 Q30 0 40 10" /></svg>
  <div class="mountains mountains--back"></div>
  <div class="mountains mountains--mid"></div>
  <div class="mountains mountains--front"></div>
  <div class="weather-overlay"></div>
  <canvas class="rain-canvas" id="rainCanvas"></canvas>
</div>

<header class="nav" id="top">
  <div class="container nav__inner">
    <a href="index.html" class="logo">
      <img src="assets/logo.png" alt="" class="logo__mark">
      Pick<span class="logo__map">Map</span>
    </a>
  </div>
</header>

<main class="auth-main">
  <div class="auth-card onboarding-card">
    <p class="eyebrow">Antes de empezar</p>
    <h1 class="onboarding-title" id="onboardingTitle">¡Bienvenida! Cuéntanos un poco de ti</h1>
    <p class="onboarding-lead">Con esto armamos panoramas pensados de verdad para ti — mientras más nos cuentes, más precisas son las recomendaciones.</p>

    <form id="formOnboarding" class="onboarding-form">
      <div class="onboarding-field">
        <label for="age">¿Qué edad tienes?</label>
        <input type="number" id="age" name="age" min="12" max="99" placeholder="Ej: 28" required>
      </div>

      <div class="onboarding-field">
        <label>¿Con quién sueles ir a tus panoramas?</label>
        <p class="onboarding-hint">Puedes elegir más de una</p>
        <div class="chip-group" id="groupCompany" data-name="company">
          <button type="button" class="chip" data-value="pareja">💑 Pareja</button>
          <button type="button" class="chip" data-value="familia">👨‍👩‍👧 Familia</button>
          <button type="button" class="chip" data-value="amigos">🎉 Amigos</button>
          <button type="button" class="chip" data-value="solo">🧍 Solo/a</button>
          <button type="button" class="chip" data-value="trabajo">🏢 Compañeros de trabajo</button>
        </div>
      </div>

      <div class="onboarding-field">
        <label>¿Qué tipo de panoramas te gustan más?</label>
        <p class="onboarding-hint">Elige todos los que apliquen</p>
        <div class="chip-group" id="groupTastes" data-name="tastes">
          <button type="button" class="chip" data-value="naturaleza">🌲 Naturaleza y aventura</button>
          <button type="button" class="chip" data-value="gastronomia">🍽️ Gastronomía</button>
          <button type="button" class="chip" data-value="relax">🧖 Relax y spa</button>
          <button type="button" class="chip" data-value="vidanocturna">🌃 Vida nocturna</button>
          <button type="button" class="chip" data-value="cultura">🎭 Cultura y tours</button>
          <button type="button" class="chip" data-value="extremo">🪂 Deportes extremos</button>
          <button type="button" class="chip" data-value="playa">🏖️ Playa</button>
          <button type="button" class="chip" data-value="nieve">❄️ Nieve</button>
          <button type="button" class="chip" data-value="shopping">🛍️ Shopping</button>
          <button type="button" class="chip" data-value="fotografia">📸 Panoramas instagrameables</button>
          <button type="button" class="chip" data-value="musica">🎶 Música y festivales</button>
          <button type="button" class="chip" data-value="ymas">✨ Y más</button>
        </div>
      </div>

      <div class="onboarding-field">
        <label for="city">¿Desde dónde te mueves? <span class="onboarding-optional">(opcional)</span></label>
        <input type="text" id="city" name="city" placeholder="Ej: Providencia, Santiago">
      </div>

      <p class="auth-error" id="onboardingError" hidden></p>

      <button type="submit" class="btn btn--primary auth-submit">Ver mi panorama personalizado</button>
      <button type="button" class="auth-link onboarding-skip" id="skipOnboarding">Prefiero hacerlo después</button>
    </form>
  </div>
</main>

<script src="js/skyline.js"></script>
<script src="js/onboarding.js"></script>
</body>
</html>
