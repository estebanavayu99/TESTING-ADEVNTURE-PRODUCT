<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F6CD4C">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pickmap">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
<title>Tus panoramas — Pickmap</title>
<meta name="description" content="Todos los panoramas que Pickmap IA armó para ti, simples y en paquete, con la razón de por qué los elegimos.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23F6CD4C%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/panoramas.css">
</head>
<body class="mode-client dash-body">

<div class="skyline" aria-hidden="true">
  <div class="sky"></div>
  <div class="sky-night"></div>
  <div class="stars"></div>
  <div class="sun"></div>
  <div class="cloud cloud--1"></div>
  <div class="cloud cloud--2"></div>
  <div class="cloud cloud--3"></div>
  <div class="cloud cloud--storm cloud--storm-1"></div>
  <div class="cloud cloud--storm cloud--storm-2"></div>
  <svg class="bird bird--1" viewBox="0 0 40 20"><path d="M0 10 Q10 0 20 10 Q30 0 40 10" /></svg>
  <svg class="bird bird--2" viewBox="0 0 40 20"><path d="M0 10 Q10 0 20 10 Q30 0 40 10" /></svg>
  <svg class="bird bird--3" viewBox="0 0 40 20"><path d="M0 10 Q10 0 20 10 Q30 0 40 10" /></svg>
  <div class="mountains mountains--back"></div>
  <div class="mountains mountains--mid"></div>
  <div class="mountains mountains--front"></div>
  <div class="weather-overlay"></div>
  <canvas class="rain-canvas" id="rainCanvas"></canvas>
</div>

<header class="nav" id="top">
  <div class="container nav__inner">
    <a href="index.html" class="logo">
      <img src="assets/logo.png" alt="" class="logo__mark">
      Pick<span class="logo__map">Map</span>
    </a>
    <nav class="nav__links">
      <a href="panoramas.html" class="nav__panoramas is-current">Panoramas</a>
      <a href="favoritos.html">Favoritos</a>
      <a href="pickpoints.html">Pick Points</a>
      <a href="invita.html">Invita a un amig@</a>
      <a href="dashboard.html">Mi cuenta</a>
    </nav>
    <div class="nav__actions">
      <button type="button" class="nav__login" id="logoutBtn">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="dash">
  <div class="container">
    <div class="dash__greeting">
      <p class="eyebrow">🤖 Darwin · tu IA de panoramas</p>
      <h1>Tus panoramas</h1>
      <p class="dash__sub" id="panoramasSub">Esto armamos para ti según tu edad, con quién sueles ir y lo que más te gusta.</p>
    </div>

    <div class="pano-advfilters">
      <div class="pano-advfilter">
        <label for="filterSort">Ordenar por</label>
        <select id="filterSort">
          <option value="recomendado">Recomendado para ti</option>
          <option value="rating">Mejor valorados</option>
          <option value="price_asc">Precio: menor a mayor</option>
          <option value="price_desc">Precio: mayor a menor</option>
        </select>
      </div>
      <div class="pano-advfilter">
        <label for="filterCategory">Tipo de experiencia</label>
        <select id="filterCategory">
          <option value="todas">Cualquiera</option>
        </select>
      </div>
      <div class="pano-advfilter">
        <label for="filterDistance">Distancia</label>
        <select id="filterDistance">
          <option value="todas">Cualquier distancia</option>
          <option value="cerca">Cerca · hasta 20 km</option>
          <option value="media">Media · 20-45 km</option>
          <option value="lejos">Lejos · 45+ km</option>
        </select>
      </div>
      <div class="pano-advfilter">
        <label for="filterPrice">Precio</label>
        <select id="filterPrice">
          <option value="todos">Cualquier precio</option>
          <option value="bajo">Hasta $15.000</option>
          <option value="medio">$15.000 - $30.000</option>
          <option value="alto">Más de $30.000</option>
        </select>
      </div>
      <div class="pano-advfilter">
        <label for="filterDay">Día</label>
        <select id="filterDay">
          <option value="todos">Cualquier día</option>
          <option value="semana">Entre semana</option>
          <option value="finde">Fin de semana</option>
        </select>
      </div>
      <button type="button" class="pano-advfilter__reset" id="resetFilters">Limpiar filtros</button>
    </div>

    <section class="pano-row">
      <div class="pano-row__header">
        <h2>Combos</h2>
        <a href="#explorar" class="pano-row__seeall" data-target-filter="paquete">Ver todo →</a>
      </div>
      <div class="pano-row__scroll" id="rowPaquete"></div>
    </section>

    <section class="pano-row">
      <div class="pano-row__header">
        <h2>Simples</h2>
        <a href="#explorar" class="pano-row__seeall" data-target-filter="simple">Ver todo →</a>
      </div>
      <div class="pano-row__scroll" id="rowSimple"></div>
    </section>

    <section class="pano-row">
      <div class="pano-row__header">
        <h2>Todos</h2>
        <a href="#explorar" class="pano-row__seeall" data-target-filter="todos">Ver todo →</a>
      </div>
      <div class="pano-row__scroll" id="rowTodos"></div>
    </section>

    <section class="pano-explore" id="explorar">
      <div class="pano-tabs">
        <button type="button" class="pano-tab is-active" data-tab="recomendado">Recomendado para ti</button>
        <button type="button" class="pano-tab" data-tab="general">General</button>
      </div>
      <div class="pano-filters" id="panoFilters">
        <button type="button" class="pano-filter is-active" data-filter="todos">Todos</button>
        <button type="button" class="pano-filter" data-filter="simple">Simples</button>
        <button type="button" class="pano-filter" data-filter="paquete">Paquetes</button>
      </div>

      <div class="pano-grid" id="panoGrid"></div>
    </section>
  </div>
</main>

<script src="js/skyline.js"></script>
<script src="js/panoramas.js"></script>
</body>
</html>
